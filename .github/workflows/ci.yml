name: CI (Build, Lint, Test)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm ci

      - name: Lint Backend
        run: |
          if [ -f .eslintrc* ] || [ -f eslint.config* ]; then
            npx eslint . || true
          else
            echo "No ESLint config found — skipping lint step"
          fi

      - name: Run Backend Tests
        env:
          JWT_SECRET: ci-test-secret
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: test
          DB_PORT: 3306
          PORT: 3000
          NODE_ENV: test
        run: npm test

  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: Front

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          # Allow scripts for sharp / unrs-resolver if present
          npm install || npm install --ignore-scripts

      - name: Lint Frontend
        run: |
          if [ -f .eslintrc* ] || [ -f eslint.config* ]; then
            npx eslint . || true
          else
            echo "No ESLint config found — skipping lint step"
          fi

      - name: Build Frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npm run build
